# One-off network probe #2 (runs only on pushes to claude/sefaria-probe): Torah-chanting audio details.
name: sefaria-probe
on:
  push:
    branches: [claude/sefaria-probe]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sefaria media entries (what exactly is a "clip"?)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, time
          def get(u, t=90):
              t0 = time.time()
              try: d = json.load(urllib.request.urlopen(u, timeout=t)); return d, time.time() - t0
              except Exception as e: return {"_error": str(e)}, time.time() - t0
          for ref in ["Genesis 1:1", "Genesis 1:2", "Genesis 17:24", "Genesis 17:25", "Numbers 6:1", "Exodus 1:1", "Exodus 1:2"]:
              d, dt = get("https://www.sefaria.org/api/related/" + urllib.parse.quote(ref))
              media = d.get("media") or []
              print(f"== {ref}  ({dt:.1f}s) keys={list(d.keys())[:12]} media={len(media)} {d.get('_error','')}")
              for m in media: print("   ", json.dumps(m, ensure_ascii=False))
          PY
      - name: related() timing for ranges (the aliya-sized range timed out last time)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, time
          def get(u, t=120):
              t0 = time.time()
              try: d = json.load(urllib.request.urlopen(u, timeout=t)); return d, time.time() - t0
              except Exception as e: return {"_error": str(e)}, time.time() - t0
          for ref in ["Genesis 17:24-17:27", "Genesis 17:7-17:27", "Genesis 17", "Genesis 1:1-1:5", "Genesis 1:1-2:3", "Exodus 1:1-1:7"]:
              d, dt = get("https://www.sefaria.org/api/related/" + urllib.parse.quote(ref))
              media = d.get("media") or []
              keys = sorted({m.get("anchorRef") for m in media})
              print(f"{ref:24} {dt:6.1f}s  media={len(media)}  err={d.get('_error','')}  first/last anchor: {keys[:1]} {keys[-1:]}  urls={len({m.get('media_url') for m in media})}")
          PY
      - name: PocketTorah repo layout (the files Sefaria points to)
        continue-on-error: true
        run: |
          set -x
          curl -sS -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/rneiss/PocketTorah/contents/data" | python3 -c "import sys,json; d=json.load(sys.stdin); print([ (x['name'],x['type'],x.get('size')) for x in d][:60] if isinstance(d,list) else d)"
          curl -sS -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/rneiss/PocketTorah/contents/data/audio" | python3 -c "import sys,json; d=json.load(sys.stdin); n=[x['name'] for x in d] if isinstance(d,list) else d; print(len(n) if isinstance(n,list) else n); print(n[:80] if isinstance(n,list) else '')"
          curl -sSI "https://raw.githubusercontent.com/rneiss/PocketTorah/master/data/audio/Shemot-1.mp3" | head -20
          curl -sS -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/rneiss/PocketTorah/license" | head -c 600
          curl -sS -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/rneiss/PocketTorah/readme" | python3 -c "import sys,json,base64; d=json.load(sys.stdin); print(base64.b64decode(d.get('content','')).decode('utf8','ignore')[:2500])"
      - name: All media sources Sefaria knows over many Tanakh refs
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, collections
          def get(u):
              try: return json.load(urllib.request.urlopen(u, timeout=90))
              except Exception as e: return {"_error": str(e)}
          refs = ["Genesis 1:1","Genesis 12:1","Genesis 28:10","Exodus 12:1","Exodus 20:1","Leviticus 19:1","Numbers 13:1","Deuteronomy 6:4","Deuteronomy 32:1","Joshua 1:1","Judges 5:1","I Samuel 1:1","II Samuel 22:1","I Kings 18:46","Isaiah 1:1","Isaiah 40:1","Jeremiah 1:1","Ezekiel 1:1","Hosea 14:2","Amos 9:7","Psalms 1:1","Psalms 23:1","Psalms 119:1","Proverbs 31:10","Job 1:1","Esther 1:1","Ruth 1:1","Lamentations 1:1","Ecclesiastes 1:1","Song of Songs 1:1","Daniel 1:1","Ezra 1:1","Nehemiah 1:1","I Chronicles 1:1","Malachi 1:1","Zechariah 14:1","Obadiah 1:1","Jonah 1:1","Micah 1:1","Habakkuk 1:1"]
          src = collections.Counter(); ex = {}
          for r in refs:
              for m in get("https://www.sefaria.org/api/related/" + urllib.parse.quote(r)).get("media", []) or []:
                  k = (m.get("source"), m.get("source_site"), m.get("license"), (m.get("description") or {}) if not isinstance(m.get("description"), dict) else json.dumps(m.get("description"), ensure_ascii=False)[:160])
                  src[k] += 1; ex.setdefault(k, (r, m.get("media_url"), m.get("anchorRef")))
          for k, n in src.most_common(): print(n, k, ex[k])
          print("refs scanned:", len(refs))
          PY
      - name: Hebcal audio page (text only) + parsha page audio
        continue-on-error: true
        run: |
          curl -sSL "https://www.hebcal.com/home/498/torah-trope-chanting-audio-leyning" -o /tmp/p.html; python3 - <<'PY'
          import re
          h = open('/tmp/p.html', encoding='utf8', errors='ignore').read()
          h = re.sub(r'(?s)<(script|style)[^>]*>.*?</\1>', ' ', h)
          t = re.sub(r'<[^>]+>', ' ', h); t = re.sub(r'\s+', ' ', t)
          i = t.find('Chanting Torah'); print(t[i:i+3500])
          print('mp3/audio links:', sorted(set(re.findall(r'https?://[^"\' ]+\.(?:mp3|m4a)', open('/tmp/p.html', encoding='utf8', errors='ignore').read())))[:20])
          PY
          curl -sSL "https://www.hebcal.com/sedrot/vayishlach-20261128" -o /tmp/s.html; python3 - <<'PY'
          import re
          h = open('/tmp/s.html', encoding='utf8', errors='ignore').read()
          print('parsha page bytes', len(h)); print('audio refs:', sorted(set(re.findall(r'[^"\' =]+(?:mp3|m4a|audio)[^"\' >]*', h)))[:30])
          PY
