# One-off network probe #3 (pushes to claude/sefaria-probe only): PocketTorah data files, CORS, chunked related().
name: sefaria-probe
on:
  push:
    branches: [claude/sefaria-probe]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: PocketTorah data/aliyah.json + calendar.json structure, repo root, audio sizes
        continue-on-error: true
        run: |
          H="Authorization: Bearer ${{ github.token }}"
          curl -sS -H "$H" "https://api.github.com/repos/rneiss/PocketTorah/contents/" | python3 -c "import sys,json; d=json.load(sys.stdin); print([(x['name'],x['type']) for x in d])"
          curl -sS -H "$H" "https://api.github.com/repos/rneiss/PocketTorah" | python3 -c "import sys,json; d=json.load(sys.stdin); print({k:d.get(k) for k in ['description','license','homepage','pushed_at','default_branch','archived']})"
          curl -sS https://raw.githubusercontent.com/rneiss/PocketTorah/master/data/aliyah.json -o /tmp/aliyah.json; ls -l /tmp/aliyah.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/aliyah.json', encoding='utf8'))
          def shape(x, depth=0, key=''):
              pad = '  ' * depth
              if isinstance(x, dict):
                  ks = list(x.keys()); print(f"{pad}{key} dict({len(ks)}) keys: {ks[:8]}")
                  if depth < 3 and ks: shape(x[ks[0]], depth + 1, f"[{ks[0]!r}]")
              elif isinstance(x, list):
                  print(f"{pad}{key} list({len(x)})")
                  if depth < 3 and x: shape(x[0], depth + 1, '[0]')
              else: print(f"{pad}{key} {type(x).__name__}: {str(x)[:80]}")
          shape(d)
          print(json.dumps(d, ensure_ascii=False)[:2500])
          PY
          curl -sS https://raw.githubusercontent.com/rneiss/PocketTorah/master/data/calendar.json | head -c 800; echo
          curl -sS -H "$H" "https://api.github.com/repos/rneiss/PocketTorah/contents/data/audio" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); tot=sum(x['size'] for x in d); print('files',len(d),'total MB',round(tot/1e6,1),'max KB',max(x['size'] for x in d)//1024)
          for n in ['Bereshit-1.mp3','Lech-Lecha-7.mp3','Shemot-1.mp3','Lech-Lecha-H.mp3','Nasso-4.mp3']:
              print(n, [x['size'] for x in d if x['name']==n])
          print('names with unusual patterns:', [x['name'] for x in d if not x['name'].endswith('.mp3')][:10])
          print(sorted({x['name'].rsplit('-',1)[0] for x in d}))"
      - name: CORS + range support of raw.githubusercontent audio (what a browser sees)
        continue-on-error: true
        run: |
          U=https://raw.githubusercontent.com/rneiss/PocketTorah/master/data/audio/Lech-Lecha-7.mp3
          echo "--- GET with Origin"; curl -sS -D - -o /dev/null -H "Origin: https://ohadsam.github.io" "$U" | grep -i -E "^(HTTP|access-control|content-length|content-type|accept-ranges|cache-control)"
          echo "--- preflight-like OPTIONS"; curl -sS -D - -o /dev/null -X OPTIONS -H "Origin: https://ohadsam.github.io" -H "Access-Control-Request-Method: GET" "$U" | grep -i -E "^(HTTP|access-control)"
          echo "--- range"; curl -sS -D - -o /dev/null -H "Range: bytes=0-1023" "$U" | grep -i -E "^(HTTP|content-range|content-length)"
      - name: related() in small chunks (the aliya-sized range 504s) – timing per chunk, Genesis 1:1-2:3 = Bereshit aliya 1
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, time
          def get(u, t=60):
              t0 = time.time()
              try: d = json.load(urllib.request.urlopen(u, timeout=t)); return d, time.time() - t0
              except Exception as e: return {"_error": str(e)}, time.time() - t0
          tot = 0; found = 0
          chunks = [("Genesis 1:%d-1:%d" % (a, min(a + 4, 31))) for a in range(1, 32, 5)] + ["Genesis 2:1-2:3"]
          for ref in chunks:
              d, dt = get("https://www.sefaria.org/api/related/" + urllib.parse.quote(ref)); tot += dt
              m = d.get("media") or []; found += len(m)
              print(f"{ref:20} {dt:5.1f}s media={len(m)} {d.get('_error','')} {[(x['anchorRef'].split()[-1], x['media_url'].split('/')[-1], x['start_time'], x['end_time']) for x in m[:2]]}")
          print("total", round(tot, 1), "s; verses with media:", found)
          PY
